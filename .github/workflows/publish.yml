name: Publish to npm

# ============================================================================
# v775：改成**手动触发**（作者要求：业务无关的改动不该顺带发版）
#
# 为什么改：原实现是 `on: push: branches: [main]` —— **任何** push 都会跑这个 workflow，
#   是否真的发版只由"package.json 的 version 在 npm 上是否已存在"决定。于是：
#     · 不含 version 变更的 push（CI 优化 / 文档 / 仓库自动化调整）→ 跑一次、什么也不做（纯噪音）；
#     · **只要某次 push 里带了 version 变更，就会立刻发布 npm + 建 Release，中间没有任何人工确认**
#       —— npm 同名版本一旦发布就**不能覆盖**，只能 deprecate，所以这一步必须有人把关。
# 现在：只有**手动**（GitHub UI 的 Run workflow，或 `gh workflow run publish.yml`）才会发布。
#   日常 push 的检查改由 `.github/workflows/ci.yml` 承担（图层审计 + 语法 + 开发机路径扫描）。
#
# 版本管理：**不自动递增**，发布版本号 = 当前 package.json 的 version 字段。
# 发版流程（手动）：改 version → push → 在 Actions 里 Run workflow（或 `gh workflow run publish.yml`）。
# Release changelog：上一版本 tag（v*）到当前之间合入 main 的 PR 标题与编号；
#                    仓库尚无任何 tag 时回退为全部已合并 PR。
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      reason:
        description: '本次发版原因（可留空；非空时会写在 Release 说明最前面）'
        required: false
        default: ''
      dry_run:
        description: '只演练：跑全部检查并生成 Release 说明，但**不发布、不建 Release**'
        type: boolean
        default: false

# 防止连续触发导致并发发布冲突（手动连点两次也只排队，不会互相踩）
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write   # 创建 tag / GitHub Release
  id-token: write   # npm Trusted Publishing (OIDC) 换取临时凭证

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 安全闸：手动触发时 GitHub 允许选分支 —— 从非 main 的分支发版会把"那个分支的版本"发出去。
      # 这里硬失败并给一句人话提示，避免出现"发了个来路不明的版本"。
      - name: Guard (must run on main)
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::发布只允许在 main 上触发（当前 ${GITHUB_REF}）。请在 Run workflow 里把 Use workflow from 选成 main。"
            exit 1
          fi
          echo "ref = ${GITHUB_REF}（OK）"

      # fetch-depth: 0 拉全量历史与 tag，changelog 需要 diff 上一个版本 tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      # 必须：npm >= 11.5.1 才支持 Trusted Publishing (OIDC) 自动交换；npm 10.x 会直接 ENEEDAUTH
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      # 兼容 OIDC 发布：npm 账户配置了 trusted publishing 时可免 NPM_TOKEN
      # （清理 .npmrc 中残留的 _authToken，让 npm 走 OIDC 换取临时凭证）
      - name: Clean .npmrc for OIDC
        run: |
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            echo "Stripping _authToken from .npmrc for OIDC..."
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Install dependencies
        run: npm ci || npm install

      # 发版前门禁（与 ci.yml 同一项，这里再跑一次：**不允许在审计不通过时发布**）
      # 层级自检（issue #131 / #142）：候选表里出现未声明的名字、或 body 级 *Mask 浮层没登记，
      # 都会静默失效（下拉被盖住 / 两个窗口互相盖）。让它在 CI 里硬失败，别等用户报「点了没反应」。
      - name: Layer audit (z-index invariants)
        run: node tools/z-layer-audit.mjs assets/whale-widget.js

      # 发版前门禁：语法 + 「不得含开发机绝对路径」（发布副本必须是 strip 过的 —— 本机踩过一次）
      # 判据就用 `TestBox` 这个开发机专属目录名（覆盖 D:/TestBox 与 D:\TestBox 两种写法，
      # 且不会误伤厂商接口里 https://api.moonshot.cn/v1/users/me/balance 这类合法字符串）。
      # 与 `_strip-dev-paths.mjs` 同一份规则；跑过 strip 后该词出现次数为 0。
      - name: Syntax + dev-path audit
        run: |
          node --check lib/index.js
          node --check assets/whale-widget.js
          if grep -n "TestBox" lib/index.js lib/accounting.mjs assets/whale-widget.js; then
            echo "::error::发布文件里出现了开发机路径（发布副本必须先跑 _strip-dev-paths.mjs --apply 再提交）"
            exit 1
          fi
          echo "语法与路径检查通过"

      # 核心不变量自检（tools/ci-audit.mjs）—— 发布前跑**完整版**（比日常 ci.yml 多一项）：
      #   ① 检查所有后台接口必须走统一安全入口    每条路由都要过 requestRejection 包装
      #   ② 检查后端提供了所有前端调用的接口      前端调用的路径都要能在后端注册表命中
      #   ③ 检查打包后是否可以运行                **真的打一个 npm 包**来验：包里 lib/ 与 assets/ 齐全、
      #                                          dsh.bundle.patch 指向的文件确实在包里、
      #                                          后端找前端单文件的候选路径能命中。
      #                                          这一项挡的是"源码全对、装出来却起不来"。
      #   ④ 检查日常ci与发版ci流程是否一致        本文件与 ci.yml 都要覆盖同一组关键检查
      #   ⑤ 检查页面动态内容是否写清来源          innerHTML 接了变量就必须登记在 tools/ci-audit.allowlist.json
      # 通过标准：五项都没有报错（退出码 0）。审计不过 → 不允许发布。
      - name: Core invariants audit (incl. packed artifact)
        run: node tools/ci-audit.mjs

      # 当前版本是否已发布过（避免重复触发同一版本时发布失败炸掉 workflow）
      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/dsh-whale-widget/${VERSION}")
          echo "### dsh-whale-widget v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "版本 ${VERSION} 已存在于 npm，跳过发布" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "版本 ${VERSION} 未发布，开始发布" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false' && github.event.inputs.dry_run != 'true'
        run: npm publish --access public --registry https://registry.npmjs.org --provenance=false
        env:
          # 可选：若在仓库设置了 NPM_TOKEN secret 则用它；未设置时自动走 OIDC
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 生成 changelog：上个 v* tag 之后合入 main 的 PR（标题 + 编号），无 tag 则取全部
      # （dry_run 时这一步照样跑 —— 正好用来预览"这次会写出什么说明"）
      - name: Build release changelog
        id: changelog
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            # 用 Unix 时间戳比较：mergedAt 是 UTC(Z)，%cI 带本地时区偏移，字符串比较跨时区会错判
            SINCE=$(git log -1 --format=%ct "$PREV_TAG")
            echo "changelog 范围：${PREV_TAG} 之后"
          else
            SINCE="0"
            echo "仓库没有 tag，changelog 回退为全部已合并 PR"
          fi
          gh pr list --state merged --base main --limit 500 --json number,title,mergedAt \
            | jq -r --argjson since "${SINCE:-0}" \
              '[ .[] | select($since == 0 or (.mergedAt | fromdateiso8601) > $since) ]
               | sort_by(.number)
               | .[] | "- \(.title) (#\(.number))"' > pr_lines.md
          if [ ! -s pr_lines.md ]; then
            echo "- 本次发布无关联的合并 PR" > pr_lines.md
          fi
          {
            # 手动触发时填的"发版原因"（非空才写）
            if [ -n "${{ github.event.inputs.reason }}" ]; then
              echo "${{ github.event.inputs.reason }}"
              echo
            fi
            echo "## What's Changed"
            echo
            cat pr_lines.md
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...v${VERSION}"
            fi
          } > release_notes.md
          cat release_notes.md

      # 创建 GitHub Release 与 v<version> tag；幂等：release 已存在则跳过
      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} 已存在，跳过创建"
            exit 0
          fi
          gh release create "v${VERSION}" \
            --target "${{ github.sha }}" \
            --title "v${VERSION}" \
            --notes-file release_notes.md

      # dry_run 时给个明确结论，免得看日志的人以为发失败了
      - name: Dry-run summary
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "### 演练结束（未发布、未建 Release）" >> "$GITHUB_STEP_SUMMARY"
          echo "上面 'Build release changelog' 那一步打印的就是本次会写入 Release 的说明。" >> "$GITHUB_STEP_SUMMARY"
