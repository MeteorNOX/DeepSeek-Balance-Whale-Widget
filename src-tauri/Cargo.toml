[package]
name = "ds-desktop-whale"
version = "2.0.0"
description = "DS Desktop Whale · DeepSeek 余额查询与记账 · 独立 Windows 桌面版"
authors = ["DSW"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ds_desktop_whale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tauri = { version = "2.8.2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
dirs = "5"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
auto-launch = "0.5"
chrono = { version = "0.4", features = ["clock", "serde"] }
log = "0.4"
env_logger = "0.11"
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
rfd = "0.15"
base64 = "0.22"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-23"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
ureq = "2"
md5 = "0.7"
tyme4rs = "1.5.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
