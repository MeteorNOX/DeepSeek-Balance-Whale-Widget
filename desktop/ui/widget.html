<!doctype html>
<html lang="zh-CN" class="desktop">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>API 余额小鲸鱼</title><link rel="stylesheet" href="/ui.css">
<script src="/client.js" defer></script><script src="/money.js" defer></script><script src="/render.js" defer></script><script src="/media-guard.js" defer></script><script src="/turn-notice.js" defer></script><script src="/account-notices.js" defer></script><script src="/gesture.js" defer></script><script src="/audio-engine.js" defer></script><script src="/preferences-v3.js" defer></script><script src="/account-view.js" defer></script><script src="/dsh-whale/widget.js" defer></script><script src="/shape.js" defer></script><script src="/input.js" defer></script><script src="/insights.js" defer></script><script src="/workshop.js" defer></script><script src="/dashboard.js" defer></script><script src="/usage-history.js" defer></script>
</head><body>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <header class="dialog-header"><div><h2 id="settings-title">API 余额设置</h2><p>自动跟随 Codex 的 API 配置，通常无需修改。</p></div><button type="button" id="close-settings" class="icon-button" aria-label="关闭 API 设置">×</button></header>
      <div class="settings-content">
      <div id="settings-error" class="notice" role="alert" hidden></div>
      <p class="help privacy-help">已有配置已隐藏。留空保留原值；填写新值才会修改。</p>
      <label>余额接口<select name="provider"><option value="auto">自动识别当前 API（推荐）</option><option value="billing">兼容账单接口</option><option value="newapi">兼容密钥额度接口</option><option value="custom-json">自定义 JSON 余额接口</option><option value="deepseek">原生余额接口</option></select></label>
      <div class="field-grid"><label>API 地址<input name="baseUrl" type="url" placeholder="留空，跟随 Codex 当前配置"><small>更换域名须同时指定该服务的密钥环境变量。</small></label><label>密钥环境变量名<input name="keyEnv" placeholder="留空，使用 Codex 的现有密钥" autocomplete="off"><small>只填变量名，例如 MY_API_KEY；不要填密钥。</small></label></div>
      <details><summary>其他 API 与自定义接口</summary><div class="field-grid"><label>Codex 配置方案（profile）<input name="profile" placeholder="默认方案"></label><label>项目目录（可选）<input name="projectDir" placeholder="读取该目录内的 .codex/config.toml"></label><label>自定义金额币种<input name="currency" maxlength="3" placeholder="USD"><small>兼容账单接口固定为 USD。</small></label><label>账单页面地址<input name="dashboardUrl" type="url" placeholder="留空，使用当前服务商"></label><label>余额路径<input name="balancePath" placeholder="/api/account/balance"></label><label>余额字段<input name="balanceField" placeholder="data.balance"></label><label>累计消耗字段（可选）<input name="usedField" placeholder="data.used"></label><label>金额换算系数<input name="balanceScale" type="number" min="0.000000001" step="any"></label><label>账单用量除数<input name="billingUsageDivisor" type="number" min="0.000001" step="any"><small>账单用量以美分返回时使用 100；请按接口文档调整。</small></label><label>每货币单位的 quota<input name="quotaPerUnit" type="number" min="0.000001" step="any"><small>仅用于返回原始 quota 的接口。</small></label></div></details>
      <details><summary>每轮费用估算（可选）</summary><p class="help">未配置有效价格时，本轮费用显示未知，仍保留已记录的 token。配置价格后，按本轮 token 估算。账户期间扣费单独记录，不归入某个对话。价格单位是每百万 token，币种使用上方设置。留空保留全部现有价格；填写模型及完整价格只更新该模型。</p><label>模型名称<input name="priceModel" autocomplete="off" placeholder="与 Codex 的模型名称完全一致"></label><div class="field-grid"><label>输入价格<input name="priceInput" type="number" min="0" step="any" placeholder="留空保持原值"></label><label>缓存命中价格<input name="priceCached" type="number" min="0" step="any" placeholder="留空保持原值"></label><label>输出价格<input name="priceOutput" type="number" min="0" step="any" placeholder="留空保持原值"></label><label>缓存写入价格（可选）<input name="priceWrite" type="number" min="0" step="any" placeholder="与输入价格相同"></label></div><label class="check"><input name="removePrice" type="checkbox"> 删除填写的模型价格</label></details>
      <label class="check"><input name="monitorSessions" type="checkbox"> 记录本机 token 用量与任务状态</label><p class="help">不发送聊天内容。使用会员账号？在菜单顶部切换到“Codex 订阅”，查看 5 小时与周额度。</p>
      </div>
      <div class="dialog-actions"><button type="button" id="cancel-settings" class="quiet">取消</button><button type="submit" class="primary">保存设置</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body></html>
